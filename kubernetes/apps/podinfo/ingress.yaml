apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podinfo
  namespace: podinfo
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
#   kubernetes.io/ingress.class: "ingress-nginx"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - podinfo.magelssen.io
    secretName: podinfo-tls-cert
  rules:
  - host: podinfo.magelssen.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: podinfo
            port:
              number: 80
