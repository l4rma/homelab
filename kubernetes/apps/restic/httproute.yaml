apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rest-server
spec:
  parentRefs:
    - name: main
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - restic.magelssen.io
  rules:
    - backendRefs:
        - name: rest-server
          port: 8000
