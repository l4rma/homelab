apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rest-server-htpasswd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: rest-server-htpasswd
  data:
    # One `user:bcrypt-hash` line per laptop (`htpasswd -nB <user>`). rest-server reloads the
    # file when it changes, so adding a laptop needs no restart.
    - secretKey: htpasswd
      remoteRef:
        key: /homelab/restic/htpasswd
