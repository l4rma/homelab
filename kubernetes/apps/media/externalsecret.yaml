apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gluetun-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: gluetun-secrets
  data:
    - secretKey: OPENVPN_USER
      remoteRef:
        key: /homelab/media/gluetun-openvpn-user
    - secretKey: OPENVPN_PASSWORD
      remoteRef:
        key: /homelab/media/gluetun-openvpn-password
