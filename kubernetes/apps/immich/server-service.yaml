apiVersion: v1
kind: Service
metadata:
  name: immich-server
  labels:
    app: immich-server
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
    - name: api-metrics
      port: 8081
      targetPort: api-metrics
    - name: ms-metrics
      port: 8082
      targetPort: ms-metrics
