apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homarr-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: homarr-secrets
  data:
    - secretKey: SECRET_ENCRYPTION_KEY
      remoteRef:
        key: /homelab/homarr/secret-encryption-key
