# The first admin account, created on the first start only. Changing the password in SSM
# later does not change it in Nextcloud: do that in the UI or with `occ user:resetpassword`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: nextcloud-admin
    template:
      data:
        nextcloud-username: admin
        nextcloud-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /homelab/nextcloud/admin-password
