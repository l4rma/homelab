apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: omada
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - omada.magelssen.io
      secretName: omada-tls
  rules:
    - host: omada.magelssen.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: omada
                port:
                  number: 80
