# Self-signed certificate on the host, so the certificate is not verified.
# `wss` makes Envoy talk HTTP/1.1 to the backend, like ingress-nginx did. Over HTTP/2
# Envoy sends websockets as extended CONNECT, which TrueNAS's nginx answers with 400.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: omada
spec:
  appProtocols:
    - gateway.envoyproxy.io/wss
  endpoints:
    - ip:
        address: 192.168.10.4
        port: 30077
  tls:
    insecureSkipVerify: true
