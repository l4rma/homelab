# Static NFS volume on TrueNAS (dataset Firelink/BlightTown/home-assistant).
# spec.nfs is immutable: changing it means a new PV.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: home-assistant-config-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 512Mi
  claimRef:
    name: home-assistant-pvc
    namespace: home-assistant
  nfs:
    path: /mnt/Firelink/BlightTown/home-assistant
    server: 192.168.10.4
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
