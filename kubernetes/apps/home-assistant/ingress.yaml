apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # The frontend keeps a websocket open. HA must trust the proxy
    # (http.trusted_proxies in configuration.yaml), or it answers 400.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ha.magelssen.io
      secretName: home-assistant-tls
  rules:
    - host: ha.magelssen.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant-svc
                port:
                  number: 8123
