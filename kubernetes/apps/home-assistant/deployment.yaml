apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  # 0 during the namespace move: the old pod in `default` must be gone before a new
  # pod opens the same SQLite database on NFS. The next PR sets this back to 1.
  replicas: 0
  # hostNetwork: two pods cannot share port 8123, so stop the old one first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      # hostNetwork means HA has the node's IP, so keep it on one node.
      nodeSelector:
        kubernetes.io/hostname: pi5
      containers:
        - name: home-assistant
          # Pinned to the version that runs (it was :stable). Upgrade in its own PR.
          image: ghcr.io/home-assistant/home-assistant:2025.12.5
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - containerPort: 8123
          securityContext:
            privileged: true
          volumeMounts:
            - name: home-assistant-config-volume
              mountPath: /config
      volumes:
        - name: home-assistant-config-volume
          persistentVolumeClaim:
            claimName: home-assistant-pvc
