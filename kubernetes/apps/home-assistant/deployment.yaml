apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  labels:
    app: home-assistant
spec:
  replicas: 1
  # hostNetwork: two pods cannot share port 8123, so stop the old one first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
    spec:
      hostNetwork: true
      # hostNetwork means HA has the node's IP, so keep it on one node.
      nodeSelector:
        kubernetes.io/hostname: pi5
      containers:
        - name: home-assistant
          # Pinned. Upgrade in its own PR, with a ZFS snapshot first.
          image: ghcr.io/home-assistant/home-assistant:2026.10.4
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: Europe/Oslo
          ports:
            - name: http
              containerPort: 8123
          # HA takes about 1.5 minutes to start. Until then the pod is not Ready, so the
          # Ingress does not send traffic to it.
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          # Uses ~400Mi idle. Room for Zigbee and more integrations later.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            privileged: true
          volumeMounts:
            - name: home-assistant-config-volume
              mountPath: /config
      volumes:
        - name: home-assistant-config-volume
          persistentVolumeClaim:
            claimName: home-assistant-pvc
