apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-pvc
  labels:
    app: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
  storageClassName: ""
  volumeName: home-assistant-pv
---
# No storageClassName on purpose: the live object has none, and it is immutable.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: home-assistant-time-pvc
  labels:
    app: home-assistant
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
  volumeName: home-assistant-time-pv
