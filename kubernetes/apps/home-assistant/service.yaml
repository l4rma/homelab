apiVersion: v1
kind: Service
metadata:
  name: home-assistant-svc
  labels:
    app: home-assistant
spec:
  type: NodePort
  selector:
    app: home-assistant
  ports:
    - name: home-assistant-web
      port: 8123
      targetPort: 8123
      # Fixed: Uptime Kuma and bookmarks use this port.
      nodePort: 31234
