apiVersion: v1
kind: Service
metadata:
  name: home-assistant-svc
  labels:
    app: home-assistant
spec:
  # ClusterIP during the move: NodePort 31234 is still held by the old Service in
  # `default` until Flux prunes it. The next PR makes this NodePort 31234 again.
  type: ClusterIP
  selector:
    app: home-assistant
  ports:
    - name: home-assistant-web
      port: 8123
      targetPort: 8123
