apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - local-path-storage.yaml
patches:
  # Retain: deleting a PVC (for example when Flux prunes a renamed app) keeps the data
  # on the node. Leftover directories under /opt/local-path-provisioner are removed by hand.
  # Not the default StorageClass: apps ask for `local-path` explicitly.
  # reclaimPolicy is immutable, so it has to be right from the start.
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: replace
        path: /reclaimPolicy
        value: Retain
  # The helper pod that creates and removes volume directories uses busybox without a
  # tag (latest). Pin it.
  - target:
      kind: ConfigMap
      name: local-path-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: local-path-config
        namespace: local-path-storage
      data:
        helperPod.yaml: |-
          apiVersion: v1
          kind: Pod
          metadata:
            name: helper-pod
          spec:
            priorityClassName: system-node-critical
            tolerations:
              - key: node.kubernetes.io/disk-pressure
                operator: Exists
                effect: NoSchedule
            containers:
            - name: helper-pod
              image: docker.io/library/busybox:1.37.0
              imagePullPolicy: IfNotPresent
  # Upstream sets no resources. It uses ~10Mi.
  - target:
      kind: Deployment
      name: local-path-provisioner
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
