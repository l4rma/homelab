apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Advertises the Intel iGPU on lenovo1 and lenovo2 as the resource `gpu.intel.com/i915`.
# Upstream already limits the DaemonSet to amd64, so pi5 gets no pod.
namespace: intel-gpu-plugin
resources:
  - namespace.yaml
  - intel-gpu-plugin.yaml
patches:
  # By default one container gets the whole GPU. Immich (server and machine learning)
  # and Jellyfin need to share it, so let up to 10 containers use it at once.
  - target:
      kind: DaemonSet
      name: intel-gpu-plugin
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args
        value:
          - -shared-dev-num=10
