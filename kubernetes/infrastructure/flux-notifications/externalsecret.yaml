# Login for the GitHub App "larma-homelab-flux" (permission: commit statuses, read and write; only
# installed on l4rma/homelab). The IDs are not secret. The private key is in SSM.
# https://fluxcd.io/flux/components/source/gitrepositories/#github
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-ssm
  target:
    name: github-app
    template:
      data:
        githubAppID: "5775331"
        githubAppInstallationID: "182362183"
        githubAppPrivateKey: "{{ .privateKey }}"
  data:
    - secretKey: privateKey
      remoteRef:
        key: /homelab/flux-system/github-app-private-key
