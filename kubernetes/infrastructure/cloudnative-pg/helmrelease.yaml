# The CloudNativePG operator only. Each app gets its own Postgres `Cluster` in its own
# folder, on the local-path StorageClass.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.29.1"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  values:
    rbac:
      # Lets the built-in view role (and so Claude's read-only account) read Clusters,
      # Backups and the other CloudNativePG objects. No secrets.
      aggregateClusterRoles: true
    monitoring:
      # Operator metrics. Each Cluster gets its own PodMonitor in the app's folder.
      podMonitorEnabled: true
      # Dashboard for the Postgres clusters, picked up by the Grafana sidecar.
      grafanaDashboard:
        create: true
    resources:
      requests:
        cpu: 10m
        memory: 96Mi
      limits:
        memory: 256Mi
