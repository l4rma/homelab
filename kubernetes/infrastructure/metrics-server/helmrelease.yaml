apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  # kube-system is the usual place for metrics-server. No Namespace object here, so Flux
  # never owns (or prunes) kube-system.
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metrics-server
      version: "3.14.0"
      sourceRef:
        kind: HelmRepository
        name: metrics-server
        namespace: flux-system
  values:
    args:
      # kubeadm kubelets use self-signed serving certificates. The connection is still
      # TLS, only the kubelet's certificate is not verified.
      - --kubelet-insecure-tls
    # The chart asks for 100m/200Mi; it uses ~25Mi here.
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
