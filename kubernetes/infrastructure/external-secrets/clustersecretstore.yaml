# All secrets come from AWS SSM Parameter Store, under /homelab/. See docs/cluster/secrets.md.
# The IAM key in aws-ssm-credentials was created by hand and is not in Git.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-west-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-ssm-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-ssm-credentials
            namespace: external-secrets
            key: secret-access-key
