apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  interval: 1h
  chart:
    spec:
      chart: metallb
      version: "0.15.3"
      sourceRef:
        kind: HelmRepository
        name: metallb
        namespace: flux-system
  install:
    createNamespace: true
  values:
    # Requests about the observed peak, memory limits about twice that, no CPU limits.
    controller:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 192Mi
    speaker:
      resources:
        requests:
          cpu: 10m
          memory: 96Mi
        limits:
          memory: 192Mi
      frr:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      reloader:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 48Mi
      frrMetrics:
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            memory: 48Mi
