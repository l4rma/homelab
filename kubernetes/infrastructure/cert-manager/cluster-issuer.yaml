apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: k8s@magelssen.io
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    - selector:
        dnsZones:
        - "magelssen.io"
      dns01:
        route53:
          region: eu-west-1
          accessKeyIDSecretRef:
            name: cert-manager-iam-creds # The secret name you just created
            key: access-key-id
          secretAccessKeySecretRef:
            name: cert-manager-iam-creds
            key: secret-access-key
