# Envoy Gateway: the controller and the CRDs (Gateway API experimental channel and
# Envoy Gateway's own). The GatewayClass, Gateway and certificate are separate files.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 1h
  chart:
    spec:
      chart: gateway-helm
      version: "v1.9.3"
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    config:
      envoyGateway:
        # The Backend resource routes to IPs outside the cluster (Proxmox, TrueNAS, ...).
        extensionApis:
          enableBackend: true
