# One wildcard certificate for every app. DNS-01 through Route53 (see the ClusterIssuer).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-magelssen-io
  namespace: envoy-gateway-system
spec:
  secretName: wildcard-magelssen-io-tls
  dnsNames:
    - "*.magelssen.io"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
