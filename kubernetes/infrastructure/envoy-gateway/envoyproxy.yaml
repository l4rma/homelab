# How Envoy Gateway runs the Envoy proxy pods for Gateways of the `envoy` class.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # Same IP as ingress-nginx had, so the Pi-hole records stay as they are.
        # externalTrafficPolicy is Local by default: apps see the real client IP.
        annotations:
          metallb.io/loadBalancerIPs: 192.168.30.200
      envoyDeployment:
        pod:
          # MetalLB does not announce from nodes labelled exclude-from-external-load-balancers
          # (kubeadm sets it on the control plane, lenovo1). With externalTrafficPolicy Local only
          # a node running Envoy may answer, so Envoy on lenovo1 means 192.168.30.200 is down.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node.kubernetes.io/exclude-from-external-load-balancers
                        operator: DoesNotExist
        container:
          # Measured in November 2026: under 45Mi, also during Immich uploads.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
