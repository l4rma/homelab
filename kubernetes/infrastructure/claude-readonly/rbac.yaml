# Read-only access for Claude Code. Kubeconfig is generated locally by
# scripts/create-claude-kubeconfig.sh and never committed.
apiVersion: v1
kind: Namespace
metadata:
  name: claude
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: claude-readonly
  namespace: claude
---
# Long-lived token. No data here: Kubernetes fills in the token itself.
apiVersion: v1
kind: Secret
metadata:
  name: claude-readonly-token
  namespace: claude
  annotations:
    kubernetes.io/service-account.name: claude-readonly
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-readonly-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: claude-readonly
    namespace: claude
---
# Cluster-scoped and Flux resources that "view" doesn't cover. No secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: claude-readonly-extra
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - source.toolkit.fluxcd.io
      - kustomize.toolkit.fluxcd.io
      - helm.toolkit.fluxcd.io
      - notification.toolkit.fluxcd.io
      - image.toolkit.fluxcd.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Prometheus Operator objects (ServiceMonitors, PrometheusRules, ...). No secrets.
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  # Gateway API and Envoy Gateway objects (Gateways, HTTPRoutes, Backends, policies).
  - apiGroups: ["gateway.networking.k8s.io", "gateway.envoyproxy.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-readonly-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: claude-readonly-extra
subjects:
  - kind: ServiceAccount
    name: claude-readonly
    namespace: claude
---
# Query Prometheus' HTTP API through the API server (read-only GET). Limited to the
# Prometheus Service. The proxy name can be "<svc>" or "<svc>:<port>".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: claude-readonly-prometheus
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames:
      - kube-prometheus-stack-prometheus
      - kube-prometheus-stack-prometheus:9090
      - kube-prometheus-stack-prometheus:http-web
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: claude-readonly-prometheus
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: claude-readonly-prometheus
subjects:
  - kind: ServiceAccount
    name: claude-readonly
    namespace: claude
