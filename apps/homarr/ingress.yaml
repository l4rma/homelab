apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homarr
  namespace: default
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dashboard.magelssen.io
      secretName: homarr-tls
  rules:
    - host: dashboard.magelssen.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homarr
                port:
                  number: 80
