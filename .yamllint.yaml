# https://yamllint.readthedocs.io/en/stable/configuration.html
extends: default

ignore: |
  # Generated by `flux bootstrap`
  kubernetes/clusters/homelab/flux-system/gotk-components.yaml

rules:
  # Long URLs, image references and descriptions read better unwrapped
  line-length: disable
  # Kubernetes manifests usually do not start with ---
  document-start: disable
  indentation:
    spaces: 2
    # Both list styles are in use (and in upstream manifests); each file must stick to one
    indent-sequences: consistent
  comments:
    min-spaces-from-content: 1
  truthy:
    # `on:` is a key in GitHub Actions workflows, not a boolean
    check-keys: false
