name: docs

# Builds the docs website with Hugo (hugo/, content from docs/) and
# publishes it to GitHub Pages from main. Pull requests only build it, so a change that
# breaks the site fails before it is merged.
# Based on https://gohugo.io/host-and-deploy/host-on-github-pages/
on:
  pull_request:
    paths:
      - docs/**
      - hugo/**
      - .github/workflows/docs.yml
  push:
    branches: [main]
    paths:
      - docs/**
      - hugo/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions: {}

# One deploy at a time, and a running deploy is never cancelled. Pull request builds
# replace each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Updated by Renovate (.github/renovate.json5)
  HUGO_VERSION: 0.170.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The theme is a Hugo module, and Hugo needs Go to download it.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: hashFiles('hugo/go.mod') != ''
        with:
          go-version-file: hugo/go.mod
          cache: false

      - name: Install Hugo
        run: |
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "hugo_${HUGO_VERSION}_checksums.txt"
          mkdir -p "${HOME}/.local/hugo"
          tar -xzf "${tarball}" -C "${HOME}/.local/hugo" hugo
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: hugo build --source hugo --gc --minify --printPathWarnings

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: hugo/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
