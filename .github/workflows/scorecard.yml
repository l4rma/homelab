name: scorecard

# OpenSSF Scorecard: grades the repository's security practices and publishes the result
# (README badge, Security → Code scanning). https://github.com/ossf/scorecard-action
# publish_results puts limits on this workflow: no env or defaults, no write permissions at the
# top, and only the approved actions in the job.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload the results to code scanning
      security-events: write
      # Sign the published results
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
